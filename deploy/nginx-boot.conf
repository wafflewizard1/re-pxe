upstream repxe_api {
    zone repxe_api 64k;
    # Docker can assign a different address when the API container is updated.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;
    server api:8000 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    autoindex off;
    location = /pxe/boot.ipxe { proxy_pass http://repxe_api; proxy_no_cache 1; access_log off; }
    location = /pxe/managed.ipxe { proxy_pass http://repxe_api; proxy_no_cache 1; access_log off; }
    location /custom/ { disable_symlinks on; types { } default_type application/octet-stream; add_header X-Content-Type-Options nosniff always; add_header Cache-Control no-store always; limit_except GET { deny all; } try_files $uri =404; }
    location /pxe/routines/ { proxy_pass http://repxe_api; proxy_no_cache 1; access_log off; }
    location /pxe/config/ { proxy_pass http://repxe_api; proxy_no_cache 1; access_log off; }
    location / { limit_except GET { deny all; } try_files $uri =404; }
}
