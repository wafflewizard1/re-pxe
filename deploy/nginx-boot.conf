server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    autoindex off;
    location = /pxe/boot.ipxe { proxy_pass http://api:8000; proxy_no_cache 1; access_log off; }
    location = /pxe/managed.ipxe { proxy_pass http://api:8000; proxy_no_cache 1; access_log off; }
    location /custom/ { disable_symlinks on; types { } default_type application/octet-stream; add_header X-Content-Type-Options nosniff always; add_header Cache-Control no-store always; limit_except GET { deny all; } try_files $uri =404; }
    location /pxe/routines/ { proxy_pass http://api:8000; proxy_no_cache 1; access_log off; }
    location /pxe/config/ { proxy_pass http://api:8000; proxy_no_cache 1; access_log off; }
    location / { limit_except GET { deny all; } try_files $uri =404; }
}
