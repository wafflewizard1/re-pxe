name: Check current source
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y libarchive-tools cmake ninja-build
      - run: python -m pip install -r server/requirements-dev.txt
      - run: python server/prepare_builtin.py
      - run: PYTHONPATH=server python -m pytest -q server/tests
      - run: node server/tests/dashboard.mjs
      - run: cmake -S client -B .local/client-check -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build .local/client-check && ctest --test-dir .local/client-check --output-on-failure
      - run: docker build -t re-pxe-check server
      - run: python tools/build_client.py
